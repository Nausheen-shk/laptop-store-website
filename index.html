<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaptopStore | Premium Laptops</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--accent:#00e5cc;--text:#fff;--muted:#9ca3af;--border:#232323}
*{font-family:'Inter',sans-serif}
h1,.brand{font-family:'Space Grotesk',sans-serif}
body{background:var(--bg);color:var(--text)}
.navbar{background:rgba(10,10,10,0.85)!important;backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:24px}.brand span{color:var(--accent)}
.search-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;color:white;padding:10px 16px;width:280px}
.cart-btn{background:var(--accent);border:none;border-radius:12px;padding:10px 18px;font-weight:600;color:#000;position:relative}
.hero{padding:80px 0 40px}.hero h1{font-size:64px;font-weight:700;line-height:0.95;letter-spacing:-2px}
.hero h1 .line2{background:linear-gradient(90deg,#00e5cc,#7c5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:18px;max-width:480px;margin-top:16px}
.cta{background:var(--accent);color:#000;border:none;border-radius:100px;padding:14px 28px;font-weight:700;margin-top:24px}
.filter-pill{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:100px;padding:8px 18px;margin:4px;font-size:14px}
.filter-pill.active,.filter-pill:hover{background:white;color:black}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:0.4s;height:100%;cursor:pointer}
.product-card:hover{transform:translateY(-8px);border-color:#3a3a3a}
.product-img{background:linear-gradient(145deg,#1e1e1e,#151515);height:200px;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.product-img img{max-height:160px;object-fit:contain}
.badge-new{position:absolute;top:12px;left:12px;background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:4px 8px;border-radius:100px}
.price{font-family:'Space Grotesk';font-weight:700;font-size:20px}
.old-price{color:var(--muted);text-decoration:line-through;font-size:14px;margin-left:8px}
.specs{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.specs span{background:var(--card2);border:1px solid var(--border);padding:4px 8px;border-radius:100px}
.add-btn{width:100%;background:white;color:black;border:none;border-radius:12px;padding:10px;font-weight:600;margin-top:12px}
.cart-count{position:absolute;top:-6px;right:-6px;background:#ff2e63;color:white;border-radius:100px;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.offcanvas{background:#101010;color:white}.cart-item{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid var(--border)}
.modal-content{background:#141414;border:1px solid #2a2a2a;border-radius:20px;color:white}
.modal-img{background:#1c1c1c;border-radius:16px;padding:20px}
</style>
</head>
<body>
<nav class="navbar navbar-dark sticky-top px-3 py-3">
<div class="container-fluid"><div class="brand">Laptop<span>Store</span></div>
<div class="d-flex align-items-center gap-3">
<input id="searchInput" class="search-box" placeholder="Search laptop...">
<button class="cart-btn" data-bs-toggle="offcanvas" data-bs-target="#cart">Cart <span id="cartCount" class="cart-count">0</span></button>
</div></div></nav>
<section class="hero"><div class="container"><div class="row align-items-center"><div class="col-lg-6">
<h1>Best Laptops <br><span class="line2">at Best Price.</span></h1>
<p>Click on any laptop to see full details.</p>
<button class="cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now →</button>
</div><div class="col-lg-6 d-none d-lg-block text-center">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=700&auto=format&fit=crop&q=60" style="width:90%;border-radius:24px"></div></div></div></section>
<div class="container text-center my-4">
<button class="filter-pill active" onclick="filterBrand('All',this)">All</button>
<button class="filter-pill" onclick="filterBrand('HP',this)">HP</button>
<button class="filter-pill" onclick="filterBrand('Dell',this)">Dell</button>
<button class="filter-pill" onclick="filterBrand('Apple',this)">Apple</button>
<button class="filter-pill" onclick="filterBrand('Lenovo',this)">Lenovo</button>
<button class="filter-pill" onclick="filterBrand('ASUS',this)">ASUS</button>
</div>
<div class="container pb-5" id="products"><div class="row g-4" id="productGrid"></div></div>

<div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content"><div class="modal-body p-4"><div class="row"><div class="col-md-6"><div class="modal-img text-center"><img id="mImg" style="width:100%;max-height:300px;object-fit:contain"></div></div><div class="col-md-6"><div id="mBrand" style="font-size:11px;letter-spacing:1px;color:#00e5cc;font-weight:700"></div><h2 id="mName" style="font-family:Space Grotesk;font-weight:700;margin-top:6px"></h2><div id="mSpecs" class="specs my-3"></div><p id="mDesc" style="color:#9ca3af;font-size:14px"></p><div class="my-3"><span id="mPrice" class="price" style="font-size:28px"></span><span id="mOld" class="old-price"></span></div><button id="mAddBtn" class="add-btn" style="background:#00e5cc;padding:14px;font-size:16px">Add to Cart - Buy Now</button><p style="font-size:12px;color:#9ca3af;margin-top:12px">✓ Free Delivery • ✓ 2 Year Warranty • ✓ 7 Days Return</p></div></div></div></div></div></div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="cart"><div class="offcanvas-header"><h5 class="offcanvas-title">Your Cart</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body d-flex flex-column"><div id="cartItems" class="flex-grow-1"></div><div class="border-top pt-3"><div class="d-flex justify-content-between mb-3"><span>Total</span><strong id="cartTotal" class="price">₹0</strong></div><button class="add-btn" style="background:#00e5cc" onclick="checkout()">Checkout</button></div></div></div>

<script>
const products=[
{id:1,brand:'Apple',name:'MacBook Air M2',price:114900,old:129900,specs:['M2 Chip','8GB RAM','256GB SSD','13.6" Liquid Retina'],img:'https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?w=500',desc:'Supercharged by M2, MacBook Air tackles everything from browsing to video editing with amazing battery life upto 18 hours.',new:true},
{id:2,brand:'Dell',name:'Dell XPS 13 Plus',price:94990,old:109990,specs:['i7 13th Gen','16GB RAM','512GB SSD','OLED 3.5K'],img:'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=500',desc:'The most powerful 13-inch in its class. Edge-to-edge keyboard and stunning display.',new:true},
{id:3,brand:'HP',name:'HP Spectre x360 14',price:87990,old:99990,specs:['i7 13th Gen','16GB','1TB SSD','OLED Touch'],img:'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500',desc:'Convertible 2-in-1 with 360 hinge, OLED touch, stylus support.'},
{id:4,brand:'Lenovo',name:'Lenovo ThinkPad X1 Carbon',price:112000,old:125000,specs:['i7 12th Gen','32GB','1TB','Business'],img:'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=500',desc:'Legendary ThinkPad durability, best keyboard, lightweight carbon body.'},
{id:5,brand:'ASUS',name:'ASUS ROG Zephyrus G14',price:134990,old:154990,specs:['Ryzen 9','RTX 4060','16GB','Gaming'],img:'https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=500',desc:'Most powerful 14 inch gaming laptop. Anime Matrix display, 165Hz.',new:true},
{id:6,brand:'Apple',name:'MacBook Pro 14" M3 Pro',price:199900,old:219900,specs:['M3 Pro','18GB','512GB','Liquid Retina XDR'],img:'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500',desc:'For pros who need extreme performance. M3 Pro chip, best display.'},
{id:7,brand:'Dell',name:'Dell Inspiron 16',price:62990,old:74990,specs:['i5 13th Gen','16GB','512GB','16" FHD+'],img:'https://images.unsplash.com/photo-1593642532400-2682810df593?w=500',desc:'Big 16 inch screen in compact body, great for students.'},
{id:8,brand:'HP',name:'HP Omen 16',price:109990,old:129990,specs:['i7 13th Gen','RTX 4050','16GB','144Hz'],img:'https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=500',desc:'Gaming beast with high refresh 144Hz display, MUX switch.'}
];
let cart=[];let activeBrand='All';
function renderProducts(list){
const grid=document.getElementById('productGrid');grid.innerHTML='';
list.forEach(p=>{
grid.innerHTML+=`<div class="col-md-6 col-lg-3"><div class="product-card" onclick="openDetail(${p.id})"><div class="product-img">${p.new?'<span class="badge-new">NEW</span>':''}<img src="${p.img}"></div><div class="p-3"><div style="font-size:11px;color:#00e5cc;font-weight:700">${p.brand.toUpperCase()}</div><div style="font-weight:600;margin:4px 0">${p.name}</div><div class="specs">${p.specs.slice(0,3).map(s=>`<span>${s}</span>`).join('')}</div><div><span class="price">₹${p.price.toLocaleString('en-IN')}</span><span class="old-price">₹${p.old.toLocaleString('en-IN')}</span></div><button class="add-btn" onclick="event.stopPropagation();addToCart(${p.id})">Add to Cart</button></div></div></div>`;
});
}
function openDetail(id){
let p=products.find(x=>x.id===id);
document.getElementById('mImg').src=p.img;
document.getElementById('mBrand').textContent=p.brand.toUpperCase();
document.getElementById('mName').textContent=p.name;
document.getElementById('mSpecs').innerHTML=p.specs.map(s=>`<span>${s}</span>`).join('');
document.getElementById('mDesc').textContent=p.desc;
document.getElementById('mPrice').textContent='₹'+p.price.toLocaleString('en-IN');
document.getElementById('mOld').textContent='₹'+p.old.toLocaleString('en-IN');
document.getElementById('mAddBtn').onclick=()=>{addToCart(id);bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();};
new bootstrap.Modal(document.getElementById('detailModal')).show();
}
function filterBrand(brand,el){activeBrand=brand;document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');applyFilters();}
function applyFilters(){let q=document.getElementById('searchInput').value.toLowerCase();let filtered=products.filter(p=> (activeBrand==='All'||p.brand===activeBrand) && (p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)));renderProducts(filtered);}
function addToCart(id){let item=cart.find(c=>c.id===id);if(item)item.qty++;else{let p=products.find(p=>p.id===id);cart.push({...p,qty:1});}updateCart();}
function updateCart(){document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);let total=cart.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById('cartTotal').textContent='₹'+total.toLocaleString('en-IN');let div=document.getElementById('cartItems');div.innerHTML=cart.length?'':'<p style="color:#9ca3af" class="text-center mt-5">Your cart is empty</p>';cart.forEach(c=>{div.innerHTML+=`<div class="cart-item d-flex gap-3"><img src="${c.img}" style="width:60px;height:60px;object-fit:contain;background:#1a1a1a;border-radius:8px"><div class="flex-grow-1"><div style="font-size:14px;font-weight:600">${c.name}</div><div style="font-size:12px;color:#9ca3af">₹${c.price.toLocaleString()} x ${c.qty}</div></div><button onclick="removeFromCart(${c.id})" style="background:none;border:none;color:#9ca3af">✕</button></div>`;});}
function removeFromCart(id){cart=cart.filter(c=>c.id!==id);updateCart();}
function checkout(){if(!cart.length)return alert('Cart empty');alert('Order placed! Total: '+document.getElementById('cartTotal').textContent);cart=[];updateCart();}
document.getElementById('searchInput').addEventListener('input',applyFilters);
renderProducts(products);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
